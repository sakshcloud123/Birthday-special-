
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bubu, Let's Play 🎮</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg, #ffe0eb, #fff5f8);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    text-align: center;
}

.container {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: 30px;
    padding: 25px 18px;
    box-shadow: 0 15px 45px rgba(150,50,80,0.18);
}

h1 {
    color: #d94f78;
    font-size: 38px;
}

p {
    color: #604c54;
    font-size: 18px;
    line-height: 1.6;
}

.score {
    color: #d94f78;
    font-size: 20px;
    font-weight: bold;
    margin: 15px;
}

.game {
    position: relative;
    width: 100%;
    height: 350px;
    background: #fff0f5;
    border: 3px solid #f08aaa;
    border-radius: 25px;
    overflow: hidden;
}

.heart {
    position: absolute;
    top: 0;
    border: none;
    background: transparent;
    font-size: 40px;
    cursor: pointer;
    padding: 5px;
    animation: fall 2.5s linear forwards;
}

@keyframes fall {

    from {
        transform: translateY(-60px);
    }

    to {
        transform: translateY(380px);
    }

}

.message {
    color: #d94f78;
    font-weight: bold;
    margin-top: 15px;
    min-height: 25px;
}

.success {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: #fff0f5;
    border-radius: 22px;
    color: #604c54;
    line-height: 1.6;
}

.success.show {
    display: block;
}

.next {
    margin-top: 20px;
    padding: 15px 30px;
    border: none;
    border-radius: 40px;
    background: #df5a82;
    color: white;
    font-size: 18px;
    font-family: inherit;
    cursor: pointer;
}

</style>
</head>

<body>

<div class="container">

<h1>Bubu, Let's Play! 🎮</h1>

<p>

Okay Chinmay baby... 😌

<br><br>

Catch <b>10 hearts</b> for me! 💗

<br>

Let's see how fast you are. 😂

</p>


<div class="score">

Hearts caught:
<span id="score">0</span> / 10

</div>


<div class="game" id="game"></div>


<div class="message" id="message">

Catch them, Bubu! 👀💗

</div>


<div class="success" id="success">

<h2>YOU DID IT! 🥹</h2>

You caught all 10 hearts!

<br><br>

But honestly...

<br>

<b>You already caught my heart a long time ago. 💗</b>

<br><br>

Now there's another surprise waiting for you...

<br>

<button class="next" onclick="goNext()">

Next Surprise → 💗

</button>

</div>

</div>


<script>

let score = 0;

let game = document.getElementById("game");

let scoreText = document.getElementById("score");

let message = document.getElementById("message");

let success = document.getElementById("success");


function createHeart() {

    if (score >= 10) {
        return;
    }

    let heart = document.createElement("button");

    heart.className = "heart";

    heart.innerHTML = "💗";

    heart.style.left =
        Math.random() * (game.clientWidth - 50) + "px";


    heart.addEventListener("click", function() {

        if (score >= 10) {
            return;
        }

        score++;

        scoreText.textContent = score;

        heart.remove();

        message.textContent =
            "Good job, Bubu! 💗";

        if (score === 10) {

            clearInterval(timer);

            message.textContent =
                "You caught all my hearts! 🥹💗";

            success.classList.add("show");

        }

    });


    game.appendChild(heart);


    setTimeout(function() {

        if (heart.parentElement) {
            heart.remove();
        }

    }, 3000);

}


let timer = setInterval(createHeart, 700);


function goNext() {

    window.location.href = "page5.html";

}

</script>

</body>
</html>
