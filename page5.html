<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flirty Corner 😏</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg, #ffe0eb, #fff5f8);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 620px;
    background: rgba(255,255,255,0.9);
    border-radius: 35px;
    padding: 35px 25px;
    box-shadow: 0 15px 45px rgba(150,50,80,0.18);
    animation: appear 1s ease;
}

h1 {
    color: #d94f78;
    font-size: clamp(34px, 8vw, 50px);
}

p {
    color: #604c54;
    font-size: clamp(18px, 4.5vw, 23px);
    line-height: 1.7;
}

.flirty-box {
    margin-top: 25px;
    padding: 30px 20px;
    min-height: 180px;
    background: linear-gradient(135deg, #fff0f5, #ffe4ed);
    border-radius: 28px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: inset 0 0 15px rgba(217,79,120,0.08);
}

.flirty-text {
    color: #d94f78;
    font-size: clamp(20px, 5vw, 27px);
    line-height: 1.6;
    font-weight: bold;
}

button {
    margin-top: 22px;
    padding: 15px 28px;
    border: none;
    border-radius: 40px;
    background: #df5a82;
    color: white;
    font-size: 18px;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(217,79,120,0.25);
}

button:active {
    transform: scale(0.95);
}

.next {
    background: #c94770;
}

.hidden {
    display: none;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.8);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes reveal {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Flirty Corner 😏</h1>

    <p>
        Okay Chinmay baby...
        <br>
        you survived the heart game. 😂
        <br><br>

        But now you've entered
        <b>my dangerous little corner. 😌</b>
        <br><br>

        Tap the button if you're brave, Bubu. 👀
    </p>

    <div class="flirty-box">

        <div class="flirty-text" id="flirtyText">
            Are you ready, my love? 😏
        </div>

    </div>

    <button onclick="showFlirt()">
        Give me a flirt 😏
    </button>

    <br>

    <button class="next" onclick="goNext()">
        Okay Bubu, what's next? 💗
    </button>

</div>

<script>

const flirts = [

    "Chinmay, you're honestly unfairly handsome. 😌",

    "Baby, if being cute was a crime, you'd be in serious trouble. 😂",

    "Bubu, you somehow became my favourite person without even asking. 🥹",

    "My love, your smile makes me fall for you all over again. 💗",

    "Chinmay, I could stare at you for way longer than I should admit. 👀",

    "Baby, you're annoying... but unfortunately you're also adorable. 😏",

    "Bubu, come here. I think I need a hug from you. 🫶",

    "My love, you make my heart do stupid little things. 😂💗",

    "Chinmay, you're my favourite distraction. And yes, I'm blaming you. 😌",

    "Baby, I hope you know how ridiculously attractive you are to me. 😏",

    "Bubu, if I had one wish right now, I'd use it to bring you closer. 🥹",

    "And finally... Chinmay, you're still the boy I look at and think, 'Yep... that's my person.' 💗"

];

let index = 0;

function showFlirt() {

    const text = document.getElementById("flirtyText");

    text.style.animation = "none";

    void text.offsetWidth;

    text.style.animation = "reveal 0.5s ease";

    text.textContent = flirts[index];

    index++;

    if (index >= flirts.length) {
        index = 0;
    }

}

function goNext() {

    window.location.href = "page6.html";

}

</script>

</body>
</html>
