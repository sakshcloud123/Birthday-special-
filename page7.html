<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Important Question 😏</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg, #ffe0eb, #fff5f8);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 620px;
    background: rgba(255,255,255,0.92);
    border-radius: 35px;
    padding: 40px 25px;
    box-shadow: 0 15px 45px rgba(150,50,80,0.18);
    animation: appear 1s ease;
}

h1 {
    color: #d94f78;
    font-size: clamp(32px, 8vw, 48px);
}

p {
    color: #604c54;
    font-size: clamp(18px, 4.5vw, 23px);
    line-height: 1.7;
}

.question {
    margin-top: 25px;
    padding: 25px 15px;
    background: #fff0f5;
    border-radius: 25px;
}

.question h2 {
    color: #d94f78;
    font-size: clamp(23px, 6vw, 32px);
    line-height: 1.4;
}

.buttons {
    position: relative;
    height: 120px;
    margin-top: 20px;
}

button {
    padding: 15px 32px;
    border: none;
    border-radius: 40px;
    font-size: 18px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
}

.yes {
    background: #df5a82;
    color: white;
    margin-right: 15px;
}

.no {
    background: #777;
    color: white;
    position: absolute;
    transition: all 0.25s ease;
}

.message {
    margin-top: 20px;
    color: #d94f78;
    font-weight: bold;
    min-height: 30px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.8);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>One Important Question... 👀</h1>

    <p>
        Okay Chinmay baby...
        <br><br>

        You've made it this far, so now
        I need one very important answer
        from my Bubu. 😌
    </p>

    <div class="question">

        <h2>
            Do you love me as much as I love you? 🥹💗
        </h2>

        <div class="buttons">

            <button class="yes" onclick="sayYes()">
                YES 💗
            </button>

            <button class="no" id="noButton">
                NO 😌
            </button>

        </div>

        <div class="message" id="message"></div>

    </div>

</div>

<script>

const noButton = document.getElementById("noButton");
const message = document.getElementById("message");

function moveNoButton() {

    const maxX = window.innerWidth - 120;
    const maxY = window.innerHeight - 80;

    const randomX =
        Math.max(10, Math.random() * maxX);

    const randomY =
        Math.max(10, Math.random() * maxY);

    noButton.style.position = "fixed";
    noButton.style.left = randomX + "px";
    noButton.style.top = randomY + "px";

    message.textContent =
        "Nice try, Bubu 😂 You can't choose NO!";
}

noButton.addEventListener("mouseenter", moveNoButton);

noButton.addEventListener("touchstart", function(event) {

    event.preventDefault();

    moveNoButton();

});

noButton.addEventListener("click", function(event) {

    event.preventDefault();

    moveNoButton();

});

function sayYes() {

    message.innerHTML =
        "I KNEW IT! 🥹💗<br><br>That's my Bubu. I love you!";

    setTimeout(function() {

        window.location.href = "page8.html";

    }, 1800);

}

</script>

</body>
</html>
